name: service_frontend
description: Flutter frontend scaffold for customer/worker service platform
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^0.13.6
  firebase_messaging: ^15.2.1
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.1
  image_picker: ^1.2.2
  crypto: ^3.0.7
  google_maps_flutter: ^2.10.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2
  mailer: ^6.1.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.0
  flutter_dotenv: ^5.2.1
  cross_file: ^0.3.4+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 400
